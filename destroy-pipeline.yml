name: Destroy-$(Date:yyyyMMdd)$(Rev:.r)

# Never run automatically on push or PR
trigger: none
pr: none

# Manual execution parameters
parameters:
  - name: environment
    displayName: 'Target Environment to Destroy'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - prod
  - name: confirm
    displayName: 'Safety Confirmation (Type "DESTROY" to execute)'
    type: string
    default: 'DESTROY'

# Variable group storing Azure Service Principal credentials
variables:
  - group: azure-sp-credentials
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform'
  - name: terraformVersion
    value: '1.5.7'

pool:
  name: 'Default'

stages:
  # ==============================================================================
  # STAGE 1: PLAN DESTROY (Generate and inspect destroy plan)
  # ==============================================================================
  - stage: DestroyPlan
    displayName: 'Stage: Plan Destroy'
    jobs:
      - job: TerraformDestroyPlan
        displayName: 'Generate & Inspect Destroy Plan'
        steps:
          # Safety confirmation guard
          - powershell: |
              $confirm = "${{ parameters.confirm }}"
              $env = "${{ parameters.environment }}"
              Write-Host "=========================================================="
              Write-Host "               DESTROY CONFIRMATION CHECK                 "
              Write-Host "=========================================================="
              if ($confirm -ne "DESTROY") {
                  Write-Error "ERROR: Destruction aborted! Confirmation was '$confirm', expected 'DESTROY'."
                  exit 1
              }
              Write-Host "Target Environment: $env"
              Write-Host "Confirmation: DESTROY accepted."
              Write-Host "=========================================================="
            displayName: 'Safety Guard Check'

          # Verify Terraform CLI
          - powershell: |
              Write-Host "==> Verifying Terraform CLI installation..."
              if (-not (Get-Command terraform -ErrorAction SilentlyContinue)) {
                  Write-Error "ERROR: Terraform CLI not found in PATH on agent. Please ensure Terraform is installed."
                  exit 1
              }
              terraform version
            displayName: 'Verify Terraform CLI'

          # Terraform Init
          - powershell: |
              Write-Host "==> Initializing Terraform with remote backend..."
              terraform init
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: 'Terraform Init'
            workingDirectory: $(terraformWorkingDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          # Generate Destroy Plan
          - powershell: |
              Write-Host "==> Generating Terraform destroy plan for environment: ${{ parameters.environment }}..."
              $destroyPlan = Join-Path "$(Build.ArtifactStagingDirectory)" "destroy.tfplan"
              terraform plan -destroy -var-file="environments/${{ parameters.environment }}.tfvars" -out="$destroyPlan"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: 'Generate Destroy Plan'
            workingDirectory: $(terraformWorkingDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_admin_password: $(TF_VAR_admin_password)

          # Display plan preview
          - powershell: |
              Write-Host "==> Preview of resources to be destroyed:"
              $destroyPlan = Join-Path "$(Build.ArtifactStagingDirectory)" "destroy.tfplan"
              $summaryPath = Join-Path "$(Build.ArtifactStagingDirectory)" "destroy-summary.txt"
              terraform show "$destroyPlan" | Out-File -FilePath "$summaryPath" -Encoding utf8
              Get-Content -Path "$summaryPath" -TotalCount 100
            displayName: 'Preview Destroy Summary'
            workingDirectory: $(terraformWorkingDirectory)

          # Stage Terraform files and destroy plan artifact
          - task: CopyFiles@2
            displayName: 'Stage Terraform Files'
            inputs:
              SourceFolder: '$(terraformWorkingDirectory)'
              Contents: |
                **/*
                !**/.terraform/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/tfcode'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Destroy Plan Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'terraform-destroy-drop'
              publishLocation: 'pipeline'

  # ==============================================================================
  # STAGE 2: APPLY DESTROY (Tear down infrastructure in Azure)
  # ==============================================================================
  - stage: DestroyApply
    displayName: 'Stage: Execute Teardown'
    dependsOn: DestroyPlan
    condition: succeeded()
    jobs:
      - deployment: TerraformDestroyApply
        displayName: 'Destroy Infrastructure'
        environment: 'infra-${{ parameters.environment }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'terraform-destroy-drop'

                # Verify Terraform CLI
                - powershell: |
                    if (-not (Get-Command terraform -ErrorAction SilentlyContinue)) {
                        Write-Error "ERROR: Terraform CLI not found in PATH on agent."
                        exit 1
                    }
                    terraform version
                  displayName: 'Verify Terraform CLI'

                # Initialize Terraform with remote state
                - powershell: |
                    $tfcodeDir = Join-Path "$(Pipeline.Workspace)" "terraform-destroy-drop/tfcode"
                    Set-Location -Path "$tfcodeDir"
                    Write-Host "==> Initializing Terraform with remote state..."
                    terraform init
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  displayName: 'Terraform Init'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                # Execute Destroy using compiled plan
                - powershell: |
                    $tfcodeDir = Join-Path "$(Pipeline.Workspace)" "terraform-destroy-drop/tfcode"
                    Set-Location -Path "$tfcodeDir"
                    $destroyPlan = Join-Path "$(Pipeline.Workspace)" "terraform-destroy-drop/destroy.tfplan"
                    $env = "${{ parameters.environment }}"

                    Write-Host "=========================================================="
                    Write-Host "        EXECUTING TERRAFORM INFRASTRUCTURE TEARDOWN        "
                    Write-Host "=========================================================="
                    terraform apply -auto-approve "$destroyPlan"
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    Write-Host "=========================================================="
                    Write-Host "   TEARDOWN COMPLETE FOR ENVIRONMENT: $env   "
                    Write-Host "=========================================================="
                  displayName: 'Execute Terraform Destroy'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    TF_VAR_admin_password: $(TF_VAR_admin_password)
