name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master
      - develop
  paths:
    include:
      - terraform/**

pr:
  branches:
    include:
      - master
  paths:
    include:
      - terraform/**

# Allow manual pipeline dispatch from the Azure DevOps UI
parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - prod
  - name: action
    displayName: 'Terraform Action'
    type: string
    default: 'apply'
    values:
      - apply
      - destroy

# Variable group storing Azure Service Principal credentials
# Variables expected in the group:
# - ARM_CLIENT_ID
# - ARM_CLIENT_SECRET
# - ARM_TENANT_ID
# - ARM_SUBSCRIPTION_ID
# - TF_VAR_admin_password
variables:
  - group: azure-sp-credentials
  - name: terraformWorkingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform'
  - name: terraformVersion
    value: '1.5.7'

pool:
  name: 'Default'

stages:
  # ==============================================================================
  # STAGE 1: BUILD (Lint, Init, Validate, and Generate Plan)
  # ==============================================================================
  - stage: Build
    displayName: 'Stage: Build & Plan'
    jobs:
      - job: TerraformBuild
        displayName: 'Lint, Validate & Generate tfplan'
        steps:
          # Verify Terraform CLI
          - powershell: |
              Write-Host "==> Verifying Terraform CLI installation..."
              if (-not (Get-Command terraform -ErrorAction SilentlyContinue)) {
                  Write-Error "Terraform CLI not found in PATH on agent. Please ensure Terraform is installed."
                  exit 1
              }
              terraform version
            displayName: 'Verify Terraform CLI'

          # Verify Terraform formatting
          - powershell: |
              Write-Host "==> Checking Terraform code formatting..."
              terraform fmt -check
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Terraform files are not properly formatted. Run 'terraform fmt' to fix."
                  exit $LASTEXITCODE
              }
            displayName: 'Terraform Format Check'
            workingDirectory: $(terraformWorkingDirectory)

          # Terraform Init
          - powershell: |
              Write-Host "==> Initializing Terraform with remote backend..."
              terraform init
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: 'Terraform Init'
            workingDirectory: $(terraformWorkingDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          # Terraform Validate
          - powershell: |
              Write-Host "==> Validating Terraform configuration syntax..."
              terraform validate
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: 'Terraform Validate'
            workingDirectory: $(terraformWorkingDirectory)

          # Terraform Plan
          - powershell: |
              Write-Host "==> Generating Terraform execution plan for environment: ${{ parameters.environment }}..."
              $planPath = Join-Path "$(Build.ArtifactStagingDirectory)" "tfplan"
              terraform plan -var-file="environments/${{ parameters.environment }}.tfvars" -out="$planPath"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: 'Terraform Plan'
            workingDirectory: $(terraformWorkingDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_admin_password: $(TF_VAR_admin_password)

          # Archive code and plan for subsequent stages
          - task: CopyFiles@2
            displayName: 'Stage Terraform Files'
            inputs:
              SourceFolder: '$(terraformWorkingDirectory)'
              Contents: |
                **/*
                !**/.terraform/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/tfcode'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan & Code Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'terraform-drop'
              publishLocation: 'pipeline'

  # ==============================================================================
  # STAGE 2: TEST (Static Analysis, Security Scanning & Plan Verification)
  # ==============================================================================
  - stage: Test
    displayName: 'Stage: Test & Security Scan'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TerraformTest
        displayName: 'Scan Infrastructure & Test Plan'
        steps:
          - download: current
            artifact: 'terraform-drop'

          - powershell: |
              if (-not (Get-Command terraform -ErrorAction SilentlyContinue)) {
                  Write-Error "Terraform CLI not found in PATH on agent."
                  exit 1
              }
              terraform version
            displayName: 'Verify Terraform CLI'

          # Run automated plan inspection test and policy checks
          - powershell: |
              $dropDir = Join-Path "$(Pipeline.Workspace)" "terraform-drop"
              $tfcodeDir = Join-Path "$dropDir" "tfcode"
              Set-Location -Path "$tfcodeDir"

              Write-Host "==> Inspecting tfplan artifact integrity..."
              terraform init -backend=false
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              Write-Host "==> Exporting human-readable plan summary..."
              $planPath = Join-Path "$dropDir" "tfplan"
              $summaryPath = Join-Path "$(Pipeline.Workspace)" "plan-summary.txt"
              terraform show "$planPath" | Out-File -FilePath "$summaryPath" -Encoding utf8
              Get-Content -Path "$summaryPath" -TotalCount 50

              Write-Host "==> Running Security & Compliance Checks on modules..."
              
              # Verify HTTPS on storage module
              $storageContent = Get-Content -Path "modules/storage/main.tf" -Raw
              if ($storageContent -notmatch 'https_traffic_only_enabled\s*=\s*true') {
                  Write-Error "ERROR: Storage module must enforce HTTPS"
                  exit 1
              }

              # Verify TLS 1.2 on storage module
              if ($storageContent -notmatch 'min_tls_version\s*=\s*"TLS1_2"') {
                  Write-Error "ERROR: Storage module must enforce TLS 1.2"
                  exit 1
              }

              # Verify SSH NSG rule exists in compute module
              $computeContent = Get-Content -Path "modules/compute/main.tf" -Raw
              if ($computeContent -notmatch 'Allow-SSH') {
                  Write-Error "ERROR: SSH rule not configured in compute module"
                  exit 1
              }

              # Verify NAT Gateway exists in network module
              $networkContent = Get-Content -Path "modules/network/main.tf" -Raw
              if ($networkContent -notmatch 'azurerm_nat_gateway') {
                  Write-Error "ERROR: NAT Gateway not configured in network module"
                  exit 1
              }

              # Verify parent main.tf orchestrates all 3 child modules
              $mainContent = Get-Content -Path "main.tf" -Raw
              if ($mainContent -notmatch 'module\s+"network"') {
                  Write-Error "ERROR: Network module not invoked in main.tf"
                  exit 1
              }
              if ($mainContent -notmatch 'module\s+"compute"') {
                  Write-Error "ERROR: Compute module not invoked in main.tf"
                  exit 1
              }
              if ($mainContent -notmatch 'module\s+"storage"') {
                  Write-Error "ERROR: Storage module not invoked in main.tf"
                  exit 1
              }

              Write-Host "==> All automated policy tests PASSED successfully."
            displayName: 'Policy & Security Tests'
            workingDirectory: $(Pipeline.Workspace)/terraform-drop/tfcode

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan Summary'
            inputs:
              targetPath: '$(Pipeline.Workspace)/plan-summary.txt'
              artifact: 'plan-summary'
              publishLocation: 'pipeline'

  # ==============================================================================
  # STAGE 3: DEPLOY (Apply Provisioning to Azure)
  # ==============================================================================
  - stage: Deploy
    displayName: 'Stage: Deploy Infrastructure'
    dependsOn: Test
    # Only deploy on master branch commits or manual dispatch
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.Reason'], 'Manual')))
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Terraform Changes'
        # Environment enables approvals, gates, and deployment history tracking in ADO
        environment: 'infra-${{ parameters.environment }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'terraform-drop'

                - powershell: |
                    if (-not (Get-Command terraform -ErrorAction SilentlyContinue)) {
                        Write-Error "Terraform CLI not found in PATH on agent."
                        exit 1
                    }
                    terraform version
                  displayName: 'Verify Terraform CLI'

                - powershell: |
                    $tfcodeDir = Join-Path "$(Pipeline.Workspace)" "terraform-drop/tfcode"
                    Set-Location -Path "$tfcodeDir"
                    Write-Host "==> Initializing Terraform with remote state..."
                    terraform init
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  displayName: 'Terraform Init'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                - powershell: |
                    $tfcodeDir = Join-Path "$(Pipeline.Workspace)" "terraform-drop/tfcode"
                    Set-Location -Path "$tfcodeDir"
                    $action = "${{ parameters.action }}"
                    $env = "${{ parameters.environment }}"
                    $planPath = Join-Path "$(Pipeline.Workspace)" "terraform-drop/tfplan"

                    if ($action -eq "destroy") {
                        Write-Host "==> Executing Terraform Destroy for environment: $env..."
                        terraform destroy -var-file="environments/$env.tfvars" -auto-approve
                    } else {
                        Write-Host "==> Applying validated Terraform plan for environment: $env..."
                        terraform apply -auto-approve "$planPath"
                    }
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  displayName: 'Terraform Apply / Action'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    TF_VAR_admin_password: $(TF_VAR_admin_password)

                - powershell: |
                    $tfcodeDir = Join-Path "$(Pipeline.Workspace)" "terraform-drop/tfcode"
                    Set-Location -Path "$tfcodeDir"
                    Write-Host "=========================================================="
                    Write-Host "         INFRASTRUCTURE PROVISIONING SUMMARY              "
                    Write-Host "=========================================================="
                    terraform output
                    Write-Host "=========================================================="
                  displayName: 'Print Deployment Outputs'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
